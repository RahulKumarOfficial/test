<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hindi Grammar MCQ Test</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Sans Devanagari","Segoe UI",Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
    line-height:1.6;
}

/* ================= CONTAINER ================= */

.container{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:15px;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:#fff;
    text-align:center;
    padding:25px 15px;
    border-radius:0 0 20px 20px;
    margin-bottom:20px;
}

.header h1{
    font-size:27px;
    margin-bottom:5px;
}

.header p{
    font-size:15px;
}

/* ================= CARDS ================= */

.student-card,
.test-card,
.result-card,
.test-top,
.question-nav{
    background:#fff;
    border-radius:16px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

/* ================= STUDENT DETAILS ================= */

.student-card h2{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:22px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
}

.form-group input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.form-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

/* ================= BUTTON ================= */

.btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#1d4ed8;
}

/* ================= TEST ================= */

#testSection,
#resultSection{
    display:none;
}

.test-top{
    margin-bottom:15px;
    padding:15px;
}

.student-info{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    font-size:14px;
    margin-bottom:12px;
}

.progress-box{
    width:100%;
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:#2563eb;
    transition:.3s;
}

/* ================= QUESTION ================= */

.question-number{
    color:#2563eb;
    font-weight:bold;
    margin-bottom:8px;
}

.question{
    font-size:19px;
    font-weight:700;
    margin-bottom:18px;
}

.option{
    display:block;
    border:1px solid #dbe1ea;
    border-radius:10px;
    padding:12px 13px;
    margin:10px 0;
    cursor:pointer;
    transition:.2s;
    background:#fff;
}

.option:hover{
    background:#f0f5ff;
    border-color:#2563eb;
}

.option input{
    margin-right:8px;
    transform:scale(1.15);
}

/* ================= NAVIGATION ================= */

.navigation{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.nav-btn{
    flex:1;
    padding:12px;
    border:0;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.prev{
    background:#e5e7eb;
    color:#111827;
}

.next{
    background:#2563eb;
    color:white;
}

.submit{
    background:#16a34a;
    color:white;
}

.submit:hover{
    background:#15803d;
}

/* ================= QUESTION LIST ================= */

.question-nav{
    margin-top:15px;
    padding:15px;
}

.question-nav h3{
    margin-bottom:10px;
    font-size:16px;
}

.q-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.q-btn{
    width:38px;
    height:38px;
    border:1px solid #d1d5db;
    background:white;
    border-radius:7px;
    cursor:pointer;
}

.q-btn.active{
    background:#2563eb;
    color:white;
}

.q-btn.answered{
    border-color:#16a34a;
    border-width:2px;
}

/* ================= RESULT ================= */

.result-card{
    text-align:center;
}

.result-card h2{
    color:#16a34a;
    margin-bottom:15px;
}

.score{
    font-size:42px;
    font-weight:bold;
    color:#2563eb;
    margin:15px 0;
}

.result-details{
    margin:20px 0;
}

.result-details div{
    padding:10px;
    margin:7px 0;
    border-radius:8px;
    background:#f3f4f6;
}

.restart{
    background:#2563eb;
    margin-top:10px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        padding:20px 12px;
        border-radius:0 0 15px 15px;
    }

    .header h1{
        font-size:21px;
    }

    .header p{
        font-size:13px;
    }

    .container{
        padding:10px;
    }

    .student-card,
    .test-card,
    .result-card{
        padding:16px;
    }

    .question{
        font-size:17px;
    }

    .option{
        font-size:15px;
        padding:11px;
    }

    .navigation{
        position:sticky;
        bottom:5px;
        background:white;
        padding:8px;
        border-radius:10px;
        box-shadow:0 0 15px rgba(0,0,0,.12);
        z-index:10;
    }

    .q-btn{
        width:35px;
        height:35px;
    }

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

    <h1>Hindi Grammar MCQ Test</h1>

    <p>
        संज्ञा • सर्वनाम • विशेषण | Total 50 Questions
    </p>

</div>


<div class="container">

<!-- =====================================================
     STUDENT DETAILS
===================================================== -->

<section id="studentSection">

    <div class="student-card">

        <h2>Student Details</h2>

        <div class="form-group">

            <label for="studentName">
                Student Name *
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
                autocomplete="name"
            >

        </div>


        <div class="form-group">

            <label for="fatherName">
                Father's Name *
            </label>

            <input
                type="text"
                id="fatherName"
                placeholder="Enter father's name"
            >

        </div>


        <button
            class="btn"
            onclick="startTest()"
        >
            Start Test
        </button>

    </div>

</section>


<!-- =====================================================
     TEST SECTION
===================================================== -->

<section id="testSection">

    <!-- TEST TOP -->

    <div class="test-top">

        <div class="student-info">

            <span>
                👤 <b id="showStudent"></b>
            </span>

            <span>
                Father's Name:
                <b id="showFather"></b>
            </span>

            <span>
                Question:
                <b id="currentNumber">1</b>/50
            </span>

        </div>


        <div class="progress-box">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>

    </div>


    <!-- QUESTION CARD -->

    <div class="test-card">

        <div
            class="question-number"
            id="questionNumber"
        >
            Question 1
        </div>


        <div
            class="question"
            id="questionText"
        ></div>


        <div id="options"></div>


        <!-- PREVIOUS NEXT -->

        <div class="navigation">

            <button
                class="nav-btn prev"
                onclick="previousQuestion()"
            >
                ← Previous
            </button>


            <button
                class="nav-btn next"
                onclick="nextQuestion()"
            >
                Next →
            </button>

        </div>


        <!-- SUBMIT -->

        <button
            class="nav-btn submit"
            onclick="submitTest()"
            style="width:100%;margin-top:10px;"
        >
            ✓ Submit Test
        </button>

    </div>


    <!-- QUESTION LIST -->

    <div class="question-nav">

        <h3>Question List</h3>

        <div
            class="q-buttons"
            id="questionButtons"
        ></div>

    </div>

</section>


<!-- =====================================================
     RESULT SECTION
===================================================== -->

<section id="resultSection">

    <div class="result-card">

        <h2>🎉 Test Completed!</h2>


        <p id="resultStudent"></p>


        <div
            class="score"
            id="score"
        >
        </div>


        <div class="result-details">

            <div>
                Total Questions:
                <b>50</b>
            </div>


            <div>
                Correct Answers:
                <b id="correct"></b>
            </div>


            <div>
                Wrong Answers:
                <b id="wrong"></b>
            </div>


            <div>
                Unanswered:
                <b id="unanswered"></b>
            </div>


            <div>
                Percentage:
                <b id="percentage"></b>
            </div>

        </div>


        <button
            class="btn restart"
            onclick="location.reload()"
        >
            🔄 Retake Test
        </button>

    </div>

</section>

</div>

/* =====================================================
   VARIABLES
===================================================== */

let currentQuestion = 0;

let answers =
    new Array(questions.length).fill(null);


/* =====================================================
   START TEST
===================================================== */

function startTest(){

    const student =
        document.getElementById("studentName")
        .value
        .trim();

    const father =
        document.getElementById("fatherName")
        .value
        .trim();


    if(student === "" || father === ""){

        alert(
            "Please enter Student Name and Father's Name."
        );

        return;
    }


    document.getElementById("showStudent")
        .textContent = student;

    document.getElementById("showFather")
        .textContent = father;


    document.getElementById("studentSection")
        .style.display = "none";


    document.getElementById("testSection")
        .style.display = "block";


    createQuestionButtons();

    showQuestion();
}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    const q =
        questions[currentQuestion];


    document.getElementById("questionNumber")
        .textContent =
        "Question " + (currentQuestion + 1);


    document.getElementById("currentNumber")
        .textContent =
        currentQuestion + 1;


    document.getElementById("questionText")
        .textContent = q.q;


    const optionsDiv =
        document.getElementById("options");


    optionsDiv.innerHTML = "";


    q.o.forEach((option,index)=>{

        const label =
            document.createElement("label");


        label.className = "option";


        label.innerHTML = `
            <input
                type="radio"
                name="answer"
                value="${index}"
                ${
                    answers[currentQuestion] === index
                    ? "checked"
                    : ""
                }
            >
            ${String.fromCharCode(65+index)}.
            ${option}
        `;


        label
            .querySelector("input")
            .addEventListener(
                "change",
                function(){

                    answers[currentQuestion] =
                        index;

                    updateQuestionButtons();

                }
            );


        optionsDiv.appendChild(label);

    });


    const progress =
        ((currentQuestion + 1) /
        questions.length) * 100;


    document.getElementById("progress")
        .style.width =
        progress + "%";


    updateQuestionButtons();
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    saveAnswer();


    if(
        currentQuestion <
        questions.length - 1
    ){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
    else{

        alert(
            "This is the last question. Please click Submit Test."
        );

    }
}


/* =====================================================
   PREVIOUS QUESTION
===================================================== */

function previousQuestion(){

    saveAnswer();


    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =====================================================
   SAVE ANSWER
===================================================== */

function saveAnswer(){

    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );


    if(selected){

        answers[currentQuestion] =
            parseInt(selected.value);

    }

}


/* =====================================================
   QUESTION BUTTONS
===================================================== */

function createQuestionButtons(){

    const box =
        document.getElementById(
            "questionButtons"
        );


    box.innerHTML = "";


    questions.forEach(
        (q,index)=>{

            const btn =
                document.createElement(
                    "button"
                );


            btn.className = "q-btn";

            btn.textContent =
                index + 1;


            btn.onclick = function(){

                saveAnswer();

                currentQuestion =
                    index;

                showQuestion();


                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            };


            box.appendChild(btn);

        }
    );

}


/* =====================================================
   UPDATE QUESTION BUTTONS
===================================================== */

function updateQuestionButtons(){

    const buttons =
        document.querySelectorAll(
            ".q-btn"
        );


    buttons.forEach(
        (btn,index)=>{

            btn.classList.remove(
                "active"
            );


            if(
                answers[index] !== null
            ){

                btn.classList.add(
                    "answered"
                );

            }


            if(
                index === currentQuestion
            ){

                btn.classList.add(
                    "active"
                );

            }

        }
    );

}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(){

    saveAnswer();


    const unanswered =
        answers.filter(
            a => a === null
        ).length;


    if(unanswered > 0){

        const confirmSubmit =
            confirm(
                "You have " +
                unanswered +
                " unanswered question(s).\n\n" +
                "Do you still want to submit the test?"
            );


        if(!confirmSubmit){

            return;

        }

    }


    let correct = 0;


    questions.forEach(
        (q,index)=>{

            if(
                answers[index] === q.a
            ){

                correct++;

            }

        }
    );


    const wrong =
        questions.length -
        correct -
        unanswered;


    const percentage =
        (
            (correct /
            questions.length) * 100
        ).toFixed(2);


    document.getElementById(
        "testSection"
    ).style.display = "none";


    document.getElementById(
        "resultSection"
    ).style.display = "block";


    document.getElementById(
        "resultStudent"
    ).innerHTML =
        `
        <b>Student:</b>
        ${
            document.getElementById(
                "studentName"
            ).value
        }

        <br>

        <b>Father's Name:</b>
        ${
            document.getElementById(
                "fatherName"
            ).value
        }
        `;


    document.getElementById(
        "score"
    ).textContent =
        correct + " / 50";


    document.getElementById(
        "correct"
    ).textContent =
        correct;


    document.getElementById(
        "wrong"
    ).textContent =
        wrong;


    document.getElementById(
        "unanswered"
    ).textContent =
        unanswered;


    document.getElementById(
        "percentage"
    ).textContent =
        percentage + "%";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

</script>
