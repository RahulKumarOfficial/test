<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dream Success Classes - Premium Assessment Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root { 
       --primary-purple: #673ab7;
       --primary-light: #f4effc;
       --bg-gradient: #f8fafc;
       --card-border: #e2e8f0;
       --text-main: #1e293b;
       --text-muted: #64748b;
       --white: #ffffff; 
       --success-color: #10b981; 
       --accent-color: #ef4444;
       --unvisited-color: #94a3b8;
       
       --result-bg: #0f172a; 
       --result-card-bg: rgba(255, 255, 255, 0.08);
    }
    
    body { 
       font-family: 'Inter', sans-serif; 
       background-color: var(--bg-gradient);
       margin: 0; padding: 0; 
       display: flex; justify-content: center; 
       color: var(--text-main);
       -webkit-font-smoothing: antialiased;
    }
    
    .container { 
       width: 100%; 
       max-width: 780px; 
       margin: 24px 0;
       padding: 0 12px;
       box-sizing: border-box; 
    }

    /* Top Branding Main Card */
    .form-header-card {
       background: var(--white);
       border-top: 8px solid var(--primary-purple);
       border-radius: 14px;
       padding: 24px;
       margin-bottom: 16px;
       border-left: 1px solid var(--card-border);
       border-right: 1px solid var(--card-border);
       border-bottom: 1px solid var(--card-border);
       box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .form-header-card h1 {
       margin: 0 0 6px 0;
       font-size: 26px;
       font-weight: 700;
       letter-spacing: -0.02em;
       color: #0f172a;
    }

    /* Meta Info Badge Panel */
    .meta-info-grid {
       display: grid;
       grid-template-columns: repeat(2, 1fr);
       gap: 10px;
       background: #f1f5f9;
       padding: 14px;
       border-radius: 10px;
       margin-top: 16px;
    }
    .meta-item {
       font-size: 13px;
       font-weight: 500;
       color: #334155;
    }
    .meta-item strong {
       color: var(--primary-purple);
       font-weight: 600;
    }

    /* Optimized Quiz Question Card Design */
    .form-question-card {
       background: var(--white);
       border-radius: 14px;
       padding: 24px;
       margin-bottom: 16px;
       border: 1px solid var(--card-border);
       box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .question-title {
       font-size: 16px;
       font-weight: 600;
       color: #0f172a;
       margin-bottom: 16px;
       line-height: 1.5;
       display: flex;
       gap: 6px;
    }
    .q-image {
       max-width: 100%;
       height: auto;
       border-radius: 8px;
       margin-bottom: 14px;
       border: 1px solid var(--card-border);
    }

    /* Options Container */
    .option-group {
       display: flex;
       flex-direction: column;
       gap: 8px;
    }
    
    /* Interactive Option Tiles Layout */
    .option-item {
       display: flex;
       align-items: center;
       padding: 12px 14px;
       background: var(--white);
       border: 1px solid #e2e8f0;
       border-radius: 10px;
       cursor: pointer;
       font-size: 14px;
       font-weight: 500;
       color: #334155;
       transition: all 0.15s ease;
       user-select: none;
    }
    .option-item:hover {
       background: #f8fafc;
       border-color: #cbd5e1;
    }
    
    /* Hidden actual radio input */
    .option-item input[type="radio"] {
       display: none;
    }
    
    /* Custom Premium ABCD Square Box indicator */
    .abcd-box {
       width: 24px;
       height: 24px;
       background: #f1f5f9;
       border: 1px solid #cbd5e1;
       border-radius: 6px;
       display: inline-flex;
       align-items: center;
       justify-content: center;
       margin-right: 12px;
       font-size: 12.5px;
       font-weight: 600;
       color: #64748b;
       transition: all 0.15s ease;
       flex-shrink: 0;
    }
    
    /* Checked State Activation Styles */
    .option-item.active-choice {
       background: var(--primary-light);
       border-color: var(--primary-purple);
       color: var(--primary-purple);
       font-weight: 600;
    }
    .option-item.active-choice .abcd-box {
       background: var(--primary-purple);
       border-color: var(--primary-purple);
       color: var(--white);
    }
    
    /* Responsive Footer & Right Aligned Button Layout */
    .form-footer {
       display: flex;
       justify-content: space-between;
       align-items: center;
       flex-direction: row-reverse;
       margin-top: 24px;
       padding: 12px 0 30px 0;
    }
    .submit-form-btn { 
       padding: 12px 36px; 
       background: var(--primary-purple); 
       color: white; border: none; border-radius: 8px; 
       font-size: 15px; font-weight: 600; cursor: pointer;
       box-shadow: 0 4px 6px -1px rgba(103, 58, 183, 0.2);
       transition: all 0.15s ease;
    }
    .submit-form-btn:hover {
       background: #512da8;
       transform: translateY(-1px);
    }
    .footer-branding {
       font-size: 13px; 
       color: var(--text-muted);
       font-weight: 500;
    }

    /* Results Dashboard Layout */
    .summary-header { 
       background: var(--result-bg); 
       padding: 24px; border-radius: 14px; margin-bottom: 16px; color: white; text-align: center; 
    }
    .summary-header h3 { margin: 0 0 4px 0; font-size: 13px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .score-display { font-size: 32px; font-weight: 800; color: #ffffff; margin: 4px 0; }
    
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .m-card { background: var(--result-card-bg); padding: 10px 4px; border-radius: 8px; font-size: 11px; font-weight: 500; color: #94a3b8; }
    .m-card b { display: block; font-size: 16px; font-weight: 700; color: #ffffff; margin-top: 2px; }

    .summary-box { max-height: 400px; overflow-y: auto; text-align: left; }
    .sum-item { padding: 14px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--card-border); font-size: 13.5px; line-height: 1.5; }
    .sum-item b { font-size: 14px; color: #0f172a; display: inline-block; margin-bottom: 4px; }
    .sum-correct { border-left: 5px solid var(--success-color); background: #f0fdf4; }
    .sum-wrong { border-left: 5px solid var(--accent-color); background: #fef2f2; }
    .sum-skipped { border-left: 5px solid var(--unvisited-color); background: #f8fafc; }
    
    .summary-box::-webkit-scrollbar { width: 5px; }
    .summary-box::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    
    /* MOBILE OPTIMIZATION */
    @media (max-width: 600px) {
       .container { margin: 0; padding: 8px; }
       .form-header-card, .form-question-card { 
          padding: 14px; 
          border-radius: 10px;
          margin-bottom: 12px;
          width: 100%;
          box-sizing: border-box;
       }
       .question-title { font-size: 15px; margin-bottom: 14px; }
       .option-item { padding: 10px 12px; border-radius: 8px; }
       .meta-info-grid { grid-template-columns: 1fr; gap: 6px; padding: 12px; }
       .form-footer {
          flex-direction: column;
          gap: 14px;
          align-items: center;
          padding: 10px 0 24px 0;
       }
       .submit-form-btn { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 10px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quizFormContainer">
      
      <div class="form-header-card">
        <h1>Dream Success Classes</h1>
        <p style="margin: 0; color: var(--text-muted); font-size: 13.5px; font-weight: 500;">Premium CBT Assessment Sheet</p>
        
        <div class="meta-info-grid">
          <div class="meta-item">📚 <strong>Subject:</strong> History (इतिहास)</div>
          <div class="meta-item">🏫 <strong>Class:</strong> Competitive Exams</div>
          <div class="meta-item">📖 <strong>Chapter:</strong> Stone Age (पाषाण काल)</div>
          <div class="meta-item">📝 <strong>Total Questions:</strong> <span id="totalQuestionsCount" style="font-weight: 700; color: #ef4444;">Fetching...</span></div>
        </div>
      </div>

      <div id="formQuestionsWrapper">
         <div style="text-align: center; padding: 40px; color: var(--text-muted); font-weight: 500;">
           Setting up responsive exam sheet...
         </div>
      </div>

      <div class="form-footer">
         <button class="submit-form-btn" onclick="triggerFormSubmit()">Submit Test</button>
         <span class="footer-branding">Dream Success Classes Portal</span>
      </div>
    </div>
  </div>

<script>
  // UNIQUE STORAGE KEY: Har test ke liye ise badal sakte hain taaki database mix na ho
  const STORAGE_KEY = "dream_success_history_10"; 
  const JSON_LINK = "https://hitory8.pages.dev/history.json"; 
  const NEGATIVE_MARK = 0.25; 

  let questions = [], userAns = [];

  window.onload = function() {
    initFormQuiz();
  };

  async function initFormQuiz() {
    try {
      const response = await fetch(JSON_LINK);
      const data = await response.json();
      
      // PERSISTENT SHUFFLE LOGIC: Refresh karne par question ka order na badle
      if (localStorage.getItem(STORAGE_KEY + "_questions")) {
         questions = JSON.parse(localStorage.getItem(STORAGE_KEY + "_questions"));
      } else {
         questions = [...data].sort(() => Math.random() - 0.5); 
         localStorage.setItem(STORAGE_KEY + "_questions", JSON.stringify(questions));
      }
      
      // RESTORE USER ANSWERS: Purane saved answers check karna
      if (localStorage.getItem(STORAGE_KEY + "_answers")) {
         userAns = JSON.parse(localStorage.getItem(STORAGE_KEY + "_answers"));
      } else {
         userAns = new Array(questions.length).fill(null);
      }
      
      document.getElementById('totalQuestionsCount').innerText = `${questions.length} MCQs`;
      renderGoogleFormQuiz();
    } catch (e) {
      document.getElementById('formQuestionsWrapper').innerHTML = `
        <div style="text-align: center; padding: 30px; color: red; font-weight:600;">
          Network Error: Kripya page refresh karein.
        </div>`;
    }
  }

  function renderGoogleFormQuiz() {
    const wrapper = document.getElementById('formQuestionsWrapper');
    wrapper.innerHTML = ""; 

    const abcdPrefix = ['A', 'B', 'C', 'D'];

    questions.forEach((q, qIdx) => {
      const card = document.createElement('div');
      card.className = 'form-question-card';
      
      let imgTag = q.image ? `<img src="${q.image}" class="q-image">` : '';
      
      let optionsHtml = q.options.map((opt, oIdx) => {
        // Agar pehle se answered hai toh checked property aur active class check karein
        const isChecked = userAns[qIdx] === opt ? 'checked' : '';
        const activeClass = userAns[qIdx] === opt ? 'active-choice' : '';
        
        return `
          <label class="option-item ${activeClass}" id="label_${qIdx}_${oIdx}">
            <input type="radio" name="question_${qIdx}" value="${opt}" ${isChecked} onclick="saveFormResponse(${qIdx}, ${oIdx}, '${opt}')">
            <span class="abcd-box">${abcdPrefix[oIdx] || ''}</span>
            <span style="flex:1; line-height:1.4;">${opt}</span>
          </label>
        `;
      }).join('');

      card.innerHTML = `
        <div class="question-title">
          <span>${qIdx + 1}.</span>
          <div style="flex:1;">${q.question} <span style="color:red">*</span></div>
        </div>
        ${imgTag}
        <div class="option-group">
          ${optionsHtml}
        </div>
      `;
      wrapper.appendChild(card);
    });
  }

  // REAL-TIME STATE SAVER
  function saveFormResponse(qIdx, oIdx, val) {
    userAns[qIdx] = val;
    
    // LocalStorage me user progress ko instanly save karna
    localStorage.setItem(STORAGE_KEY + "_answers", JSON.stringify(userAns));
    
    for(let i=0; i<4; i++) {
       const lbl = document.getElementById(`label_${qIdx}_${i}`);
       if(lbl) lbl.classList.remove('active-choice');
    }
    
    const activeLabel = document.getElementById(`label_${qIdx}_${oIdx}`);
    if(activeLabel) activeLabel.classList.add('active-choice');
  }

  function triggerFormSubmit() {
    Swal.fire({
      title: 'Submit Assessment?',
      text: 'Kya aap apna answers submit karna chahte hain?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#673ab7',
      cancelButtonColor: '#64748b',
      confirmButtonText: 'Yes, Submit Test'
    }).then(r => { if(r.isConfirmed) evaluateFormQuiz(); });
  }

  async function evaluateFormQuiz() {
    let rawScore = 0, correctCount = 0, wrongCount = 0, summaryHtml = "";
    
    questions.forEach((q, i) => {
      let isCorrect = userAns[i] === q.answer;
      let statusClass = isCorrect ? 'sum-correct' : (userAns[i] ? 'sum-wrong' : 'sum-skipped');
      
      if(userAns[i]) {
          if(isCorrect) { correctCount++; rawScore += 1; }
          else { wrongCount++; rawScore -= NEGATIVE_MARK; }
      }
      
      summaryHtml += `<div class="sum-item ${statusClass}">
        <b>Q.${i+1}: ${q.question}</b><br>
        Your Answer: <span style="font-weight:600">${userAns[i] || 'Not Answered'}</span> ${isCorrect ? '✅' : (userAns[i] ? '❌ (-' + NEGATIVE_MARK + ')' : '')}<br>
        <span style="color:var(--success-color); font-weight:600;">Correct Answer: ${q.answer}</span>
      </div>`;
    });

    let finalScore = rawScore.toFixed(2);
    let totalQ = questions.length;
    let percent = ((rawScore / totalQ) * 100).toFixed(1);
    if(percent < 0) percent = 0; 
    let skippedCount = totalQ - (correctCount + wrongCount);

    // SUBMIT HO GAYA TOH LOCALSTORAGE DATA CLEAN KAREIN (Important Step)
    localStorage.removeItem(STORAGE_KEY + "_questions");
    localStorage.removeItem(STORAGE_KEY + "_answers");

    await Swal.fire({ title: 'Evaluating...', text: 'Aapka performance card generate ho raha hai.', icon: 'success', timer: 1000, showConfirmButton: false });

    Swal.fire({
      title: 'Assessment Summary', width: '98%',
      html: `
        <div class="summary-header">
           <h3>Overall Scorecard</h3>
           <div class="score-display">${finalScore} / ${totalQ}</div>
           <div class="metrics-grid">
              <div class="m-card">Accuracy<b>${percent}%</b></div>
              <div class="m-card">Correct<b style="color:#10b981">${correctCount}</b></div>
              <div class="m-card">Wrong<b style="color:#ef4444">${wrongCount}</b></div>
              <div class="m-card">Skipped<b style="color:#94a3b8">${skippedCount}</b></div>
           </div>
        </div>
        <div class="summary-box">${summaryHtml}</div>
      `,
      confirmButtonColor: '#673ab7',
      confirmButtonText: 'Re-take Assessment',
      allowOutsideClick: false
    }).then(() => location.reload());
  }
</script>
</body>
</html>
